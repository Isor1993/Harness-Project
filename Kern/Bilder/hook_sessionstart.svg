<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="700" fill="#ffffff"/>

  <defs>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrGrey" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="30" y="36" font-size="21" font-weight="700" fill="#0f172a">SessionStart-Hook — was sich ändert</text>
  <text x="30" y="58" font-size="13" fill="#64748b">Derselbe Ablauf, einmal als Bitte an Claude und einmal als Handgriff des Harness. Stand 2026-08-23, Harness 2.0.0.</text>

  <!-- ============ Bahn A: heute ============ -->
  <rect x="20" y="80" width="940" height="188" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="38" y="106" font-size="15" font-weight="700" fill="#991b1b">VORHER — eine Bitte</text>
  <text x="205" y="106" font-size="12.5" fill="#b91c1c">CLAUDE.md, Leseordnung Punkt 5 · greift nur, wenn Claude die Zeile liest und befolgt</text>

  <g font-size="12" fill="#0f172a">
    <rect x="34" y="124" width="150" height="66" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="109" y="152" text-anchor="middle" font-weight="600">/clear</text>
    <text x="109" y="170" text-anchor="middle" font-size="11" fill="#64748b">Session beginnt</text>

    <rect x="219" y="124" width="150" height="66" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="294" y="146" text-anchor="middle" font-weight="600">CLAUDE.md lädt</text>
    <text x="294" y="164" text-anchor="middle" font-size="11" fill="#64748b">automatisch</text>
    <text x="294" y="179" text-anchor="middle" font-size="11" fill="#64748b">Leseordnung 1–5</text>

    <rect x="404" y="124" width="150" height="66" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="479" y="146" text-anchor="middle" font-weight="600">Punkt 5 bittet:</text>
    <text x="479" y="164" text-anchor="middle" font-size="11" fill="#64748b">„pruefen.py laufen</text>
    <text x="479" y="179" text-anchor="middle" font-size="11" fill="#64748b">lassen und melden"</text>

    <rect x="589" y="124" width="150" height="66" rx="7" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <text x="664" y="146" text-anchor="middle" font-weight="700" fill="#991b1b">Claude muss</text>
    <text x="664" y="163" text-anchor="middle" font-weight="700" fill="#991b1b">daran denken</text>
    <text x="664" y="181" text-anchor="middle" font-size="11" fill="#b91c1c">← die schwache Stelle</text>

    <rect x="774" y="124" width="150" height="66" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="849" y="152" text-anchor="middle" font-weight="600">Skript läuft</text>
    <text x="849" y="170" text-anchor="middle" font-size="11" fill="#64748b">Ergebnis gemeldet</text>

    <line x1="186" y1="157" x2="215" y2="157" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrGrey)"/>
    <line x1="371" y1="157" x2="400" y2="157" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrGrey)"/>
    <line x1="556" y1="157" x2="585" y2="157" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrGrey)"/>
    <line x1="741" y1="157" x2="770" y2="157" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrRed)"/>
  </g>

  <text x="756" y="212" font-size="11.5" fill="#b91c1c" font-weight="600">gerissen am 2026-08-23</text>
  <text x="38" y="212" font-size="12" fill="#7f1d1d">Am 2026-08-23 dreimal gerissen: Anzahl-Regel gebrochen · Glossar sammelte drei falsche Zeilen ·</text>
  <text x="38" y="230" font-size="12" fill="#7f1d1d">ein überholter Planabschnitt wurde als gültiger Auftrag vorgelesen.</text>
  <text x="38" y="253" font-size="12" fill="#7f1d1d">Eine Regel, an die man sich erinnern muss, ist keine Regel — sie ist eine Bitte.</text>

  <!-- ============ Bahn B: mit Hook ============ -->
  <rect x="20" y="292" width="940" height="216" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="38" y="318" font-size="15" font-weight="700" fill="#166534">NACHHER — eine Tatsache</text>
  <text x="250" y="318" font-size="12.5" fill="#15803d">.claude\settings.json · der Harness führt aus, nicht Claude</text>

  <g font-size="12" fill="#0f172a">
    <rect x="34" y="336" width="150" height="66" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="109" y="364" text-anchor="middle" font-weight="600">/clear</text>
    <text x="109" y="382" text-anchor="middle" font-size="11" fill="#64748b">Session beginnt</text>

    <rect x="219" y="336" width="150" height="66" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="294" y="358" text-anchor="middle" font-weight="700" fill="#166534">SessionStart</text>
    <text x="294" y="375" text-anchor="middle" font-weight="700" fill="#166534">feuert</text>
    <text x="294" y="392" text-anchor="middle" font-size="11" fill="#15803d">Matcher: clear</text>

    <rect x="404" y="336" width="150" height="66" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="479" y="358" text-anchor="middle" font-weight="600">Harness startet</text>
    <text x="479" y="375" text-anchor="middle" font-weight="600">pruefen.py --hook</text>
    <text x="479" y="392" text-anchor="middle" font-size="11" fill="#64748b">ohne Claude</text>

    <rect x="589" y="336" width="150" height="66" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="664" y="356" text-anchor="middle" font-weight="600">stdout → Kontext</text>
    <text x="664" y="374" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#166534">[SessionStart-Hook]</text>
    <text x="664" y="391" text-anchor="middle" font-size="11" fill="#64748b">beweist die Herkunft</text>

    <rect x="774" y="336" width="150" height="66" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="849" y="364" text-anchor="middle" font-weight="600">Ergebnis steht da</text>
    <text x="849" y="382" text-anchor="middle" font-size="11" fill="#64748b">Claude meldet es</text>

    <line x1="186" y1="369" x2="215" y2="369" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrGreen)"/>
    <line x1="371" y1="369" x2="400" y2="369" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrGreen)"/>
    <line x1="556" y1="369" x2="585" y2="369" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrGreen)"/>
    <line x1="741" y1="369" x2="770" y2="369" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  </g>

  <text x="38" y="428" font-size="12" fill="#14532d">Vier feste Glieder. Der Hook kann die Session nicht blockieren: bei SessionStart werden Exit-Code und Fehler</text>
  <text x="38" y="446" font-size="12" fill="#14532d">ignoriert — fällt das Skript aus, siehst du eine Meldung und die Session startet trotzdem.</text>
  <text x="38" y="468" font-size="12" fill="#14532d">Was der Hook NICHT abnimmt: das Melden. Ausführen ist erzwungen, Berichten bleibt Claudes Sache.</text>
  <text x="38" y="490" font-size="12" fill="#14532d">Erledigt ist damit nur der Einstieg — jedes /harness:sichern prüft weiterhin selbst, nach dem Schreiben.</text>

  <!-- ============ Matcher-Leiste ============ -->
  <text x="30" y="546" font-size="15" font-weight="700" fill="#0f172a">Die fünf Auslöser — und warum vier davon eingetragen sind</text>

  <g font-size="12">
    <rect x="30" y="562" width="176" height="92" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="118" y="586" text-anchor="middle" font-weight="700" fill="#166534">clear</text>
    <text x="118" y="606" text-anchor="middle" font-size="11" fill="#15803d">/clear nach</text>
    <text x="118" y="621" text-anchor="middle" font-size="11" fill="#15803d">/harness:ende</text>
    <text x="118" y="642" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">DEIN NORMALFALL</text>

    <rect x="216" y="562" width="176" height="92" rx="7" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="304" y="586" text-anchor="middle" font-weight="700" fill="#166534">startup</text>
    <text x="304" y="608" text-anchor="middle" font-size="11" fill="#15803d">Claude Code frisch</text>
    <text x="304" y="623" text-anchor="middle" font-size="11" fill="#15803d">geöffnet</text>

    <rect x="402" y="562" width="176" height="92" rx="7" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="490" y="586" text-anchor="middle" font-weight="700" fill="#166534">resume</text>
    <text x="490" y="608" text-anchor="middle" font-size="11" fill="#15803d">alte Session</text>
    <text x="490" y="623" text-anchor="middle" font-size="11" fill="#15803d">wieder aufgenommen</text>

    <rect x="588" y="562" width="176" height="92" rx="7" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="676" y="586" text-anchor="middle" font-weight="700" fill="#166534">compact</text>
    <text x="676" y="608" text-anchor="middle" font-size="11" fill="#15803d">Kontext war voll,</text>
    <text x="676" y="623" text-anchor="middle" font-size="11" fill="#15803d">Ergebnis war weg</text>

    <rect x="774" y="562" width="176" height="92" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <text x="862" y="586" text-anchor="middle" font-weight="700" fill="#64748b">fork</text>
    <text x="862" y="608" text-anchor="middle" font-size="11" fill="#94a3b8">nicht eingetragen —</text>
    <text x="862" y="623" text-anchor="middle" font-size="11" fill="#94a3b8">Kontext wird geerbt,</text>
    <text x="862" y="638" text-anchor="middle" font-size="11" fill="#94a3b8">Ergebnis ist schon da</text>
  </g>

  <text x="30" y="682" font-size="11.5" fill="#64748b">Dass der Hook eingetragen bleibt, prüft pruefen.py als Prüfung 6 — Vorlage (Kern/Vorlagen/settings.json) gegen Arbeitskopie (.claude/settings.json).</text>
</svg>
